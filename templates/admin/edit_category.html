{% extends "admin/base.html" %}
{% block title %}Edit Category | ShopZone Admin{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>Edit Category</h1>
        <p>Update the category name and description.</p>
    </div>
    <a href="{{ url_for('admin_category') }}" class="btn btn-secondary">Back to Categories</a>
</div>

<div class="category-form-container">
    <form method="POST">
        <div class="form-group">
            <label for="name">Category Name</label>
            <input id="name" name="name" type="text" value="{{ category.name }}" maxlength="120" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4">{{ category.description or '' }}</textarea>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('admin_category') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Category</button>
        </div>
    </form>
</div>
{% endblock %}
